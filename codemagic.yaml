workflows:
  android-release:
    name: AutoDev Android Release
    max_build_duration: 120
    environment:
      flutter: 3.24.0
      java: 17
      android_signing:
        - autodev_keystore
    scripts:
      - name: Regenerate Android platform
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          echo "PWD=`pwd`"
          echo "LIST BEFORE:"
          ls -la
          rm -rf android
          flutter create --platforms=android --org uz.autodev --project-name autodev .
          echo "LIST AFTER CREATE:"
          ls -la
          echo "ANDROID LIST:"
          ls -la android
          test -d android
      - name: Apply AutoDev Android customizations
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          echo "PWD=`pwd`"
          ls -la
          cp android_overrides/app_build.gradle android/app/build.gradle
          cp android_overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp android_overrides/proguard-rules.pro android/app/proguard-rules.pro
          mkdir -p android/app/src/main/res/xml
          cp android_overrides/network_security_config.xml android/app/src/main/res/xml/
          cp android_overrides/file_paths.xml android/app/src/main/res/xml/
          rm -rf android/app/src/main/kotlin
          mkdir -p android/app/src/main/kotlin/uz/autodev/app
          cp android_overrides/MainActivity.kt android/app/src/main/kotlin/uz/autodev/app/MainActivity.kt
      - name: Get packages
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          echo "PWD=`pwd`"
          flutter pub get
      - name: Build release APK
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          echo "PWD=`pwd`"
          flutter build apk --release --build-name=1.0.0 --build-number=$BUILD_NUMBER
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
    publishing:
      email:
        recipients:
          - your@email.com
        notify:
          success: true
          failure: true
